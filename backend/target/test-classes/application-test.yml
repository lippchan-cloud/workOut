# 集成测试直连 SQLPub MySQL（与主配置同一实例），不再使用 H2。
# 测试会向 work_out_user / work_out_daily_record / work_out_profile 写入数据；用例通过 UUID 后缀用户名降低冲突。
# Flyway 仅执行尚未记录的迁移（V1 建旧表名，V2 再 RENAME/CREATE 为 work_out_*），不改动库中其它业务表。
spring:
  datasource:
    url: ${WORKOUT_DB_URL:jdbc:mysql://mysql5.sqlpub.com:3310/inv_doc?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${WORKOUT_DB_USER:user_lipp}
    password: ${WORKOUT_DB_PASSWORD:pgGSlfNr1pSJbcq1}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true

workout:
  jwt:
    secret: test-secret-key-which-is-long-enough-for-hs256-algorithms-0123456789
    expire-days: 7
