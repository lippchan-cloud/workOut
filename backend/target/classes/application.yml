spring:
  application:
    name: workout
  datasource:
    url: ${WORKOUT_DB_URL:jdbc:mysql://localhost:3306/workout?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${WORKOUT_DB_USER:root}
    password: ${WORKOUT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080

workout:
  jwt:
    secret: ${WORKOUT_JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-256-bits}
    expire-days: 7
