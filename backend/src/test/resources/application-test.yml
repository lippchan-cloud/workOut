spring:
  datasource:
    url: jdbc:h2:mem:workout;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

workout:
  jwt:
    secret: test-secret-key-which-is-long-enough-for-hs256-algorithms-0123456789
    expire-days: 7
