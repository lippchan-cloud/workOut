spring:
  application:
    name: workout
  datasource:
    url: ${WORKOUT_DB_URL:jdbc:mysql://mysql5.sqlpub.com:3310/inv_doc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${WORKOUT_DB_USER:user_lipp}
    password: ${WORKOUT_DB_PASSWORD:pgGJlfNr1pSJbcq1}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    # inv_doc 为共享库、已有其它表但无 flyway_schema_history：先 baseline，再只跑 V2（创建/重命名 work_out_*）
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Shared inv_doc schema already has other tables
  jackson:
    time-zone: Asia/Shanghai
  # C 端邮箱验证码 SMTP（163）；授权码非登录密码。详见 doc/workOut-邮箱SMTP.md
  mail:
    host: ${WORKOUT_MAIL_HOST:smtp.163.com}
    port: ${WORKOUT_MAIL_PORT:465}
    username: ${WORKOUT_MAIL_USERNAME:lippcloud@163.com}
    password: ${WORKOUT_MAIL_PASSWORD:JYQ8CqSJmZ7GEuAD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

workout:
  jwt:
    secret: ${WORKOUT_JWT_SECRET:ZK++GivMTbpopIqjpEeQNjikcFBnSzu0iy+mYXPDlzkCQ4f7IW/99AcSIixVpXyC}
    expire-days: 7
  admin:
    # 逗号分隔；注册或登录时提升为 ADMIN。私有仓可直接写用户名。
    usernames: ${WORKOUT_ADMIN_USERNAMES:lipp}
  public-base-url: ${WORKOUT_PUBLIC_BASE_URL:http://localhost:8080}
  mail:
    # 发件人须与 163 授权账号一致
    from: ${WORKOUT_MAIL_FROM:lippcloud@163.com}
  ai:
    # 限流与上下文向量化均以 MySQL 为准，不用 Redis / 内存计数器 / 独立向量库。
    async:
      sync: false
    deepseek:
      stub: false
      # 勿把真实 Key 写入仓库；GitHub push protection 会拒绝。本地用环境变量。
      api-key: ${WORKOUT_DEEPSEEK_API_KEY:}
      seed-usernames: ${WORKOUT_DEEPSEEK_SEED_USERNAMES:demo,lipp}
