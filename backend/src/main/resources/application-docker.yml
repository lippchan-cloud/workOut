# Docker / 单机镜像默认：内嵌 H2 文件库，无需外部 MySQL。
# 数据目录可用环境变量 WORKOUT_H2_PATH 覆盖（默认 /data/workout）。
spring:
  datasource:
    url: jdbc:h2:file:${WORKOUT_H2_PATH:/data/workout};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Docker H2 starts at V2 work_out_* tables

workout:
  jwt:
    secret: ${WORKOUT_JWT_SECRET:ZK++GivMTbpopIqjpEeQNjikcFBnSzu0iy+mYXPDlzkCQ4f7IW/99AcSIixVpXyC}
    expire-days: 7
