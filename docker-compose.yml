# 可选：与 `docker run` 等价的一键启动（连项目 MySQL，非内嵌 H2）
# 需能访问 SQLPub（或通过 WORKOUT_DB_* 指向可达的 MySQL）。本机 MySQL 请用 host.docker.internal。
services:
  workout:
    build: .
    image: workout:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 可选覆盖，默认与 application.yml 相同：
      # WORKOUT_DB_URL: jdbc:mysql://host.docker.internal:3306/inv_doc?...
      # WORKOUT_DB_USER: user_lipp
      # WORKOUT_DB_PASSWORD: ...
